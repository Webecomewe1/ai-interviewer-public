<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — AI Interviewer</title>
  <meta name="description" content="Sign in to your AI Interviewer account." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090d" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
  <script>(function(){var t;try{t=localStorage.getItem('ai-interviewer:theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)})();</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar glass">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <div class="brand-text">
          <span class="brand-name">AI Interviewer</span>
          <span class="brand-sub">Voice practice, instant feedback</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" id="theme-toggle" class="icon-btn" title="Toggle light / dark theme" aria-label="Toggle theme">
          <svg id="theme-sun" class="theme-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg id="theme-moon" class="theme-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="auth-page">
    <div class="card auth-panel">
      <div class="auth-head">
        <h1 class="auth-title">Welcome back</h1>
        <p class="panel-note">Sign in to keep your interviews saved to your account.</p>
      </div>
      <form id="login-form" class="auth-card" autocomplete="on">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Your password" autocomplete="current-password" required />
        </div>
        <div class="auth-actions">
          <button type="submit" class="btn primary block" id="login-btn" data-label="Sign in">Sign in</button>
        </div>
      </form>
      <div class="auth-links">
        <a href="register.html?forgot=1" class="link-btn">Forgot password?</a>
        <a href="register.html" class="link-btn">New here? Create an account</a>
        <a href="index.html" class="link-btn">Back to home</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/authform.js"></script>
</body>
</html>
